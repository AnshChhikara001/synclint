# Ground truth for the fixture corpus.
#
# Each case is one commit against `corpus/base`, and records the section that
# commit should invalidate and the chunk whose change invalidates it. This is
# written by hand and deliberately independent of what synclint can currently
# detect: a case nothing reaches is a gap in the tool to be measured, not a
# case to be rewritten.
#
# Kinds: renamed-parameter, changed-default, removed-capability,
# undocumented-feature. Five of each.

[[case]]
id = "find-query-renamed"
kind = "renamed-parameter"
section = "docs/catalogue.md#Catalogue > Finding books"
chunk = "bookshelf/catalogue.py::Catalogue.find"
description = "find's query parameter is now called text"

[[case]]
id = "read-csv-path-renamed"
kind = "renamed-parameter"
section = "docs/importing.md#Importing > Reading a CSV"
chunk = "bookshelf/importer.py::read_csv"
description = "read_csv takes source rather than path"

