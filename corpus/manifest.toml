section = "docs/exporting.md#Exporting > JSON"
chunk = "bookshelf/exporter.py::write_json"
description = "write_json takes destination rather than path"
repair_says = ["write_json(books, destination)"]
repair_drops = ["write_json(books, path)"]

[[case]]
id = "renew-days-default"
