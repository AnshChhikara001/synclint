repair_says = ["merg"]
repair_drops = []

# Decoys: changes that must produce no finding, so that a precision figure has
# negative cases to be computed over. A decoy carries no section and no chunk
# because what it asserts is an absence. Its kind is a claim about the change —
# `internal-refactor` and `added-parameter` really do change a chunk, the other
# three really do not — and the audit holds each decoy to it.
#
# Kinds: internal-refactor, added-parameter, comment-edit, formatting,
# test-only.

[[decoy]]
id = "is-valid-weights-hoisted"
kind = "internal-refactor"
description = "is_valid reads its weights from a named tuple"

[[decoy]]
id = "recent-sorts-by-a-named-key"
kind = "internal-refactor"
description = "recent sorts by a named key and filters through a predicate"

[[decoy]]
id = "matches-hoists-its-closure"
kind = "internal-refactor"
description = "matches hoists its closure to a module-level helper"

[[decoy]]
id = "save-extracts-the-backup"
kind = "internal-refactor"
description = "save takes its backup through a helper"

[[decoy]]
id = "isbn-checksum-explained"
kind = "comment-edit"
description = "the ISBN-13 checksum gets the comment it always needed"

[[decoy]]
id = "loans-dates-explained"
kind = "comment-edit"
description = "loans explains its date arithmetic"

[[decoy]]
id = "writers-reflowed"
kind = "formatting"
description = "the importer and exporter wrap at seventy-nine columns"

[[decoy]]
id = "queries-reflowed"
kind = "formatting"
description = "the catalogue and search wrap at seventy-nine columns"

[[decoy]]
id = "tests-cover-loans"
kind = "test-only"
description = "loans gains a test module"

[[decoy]]
id = "tests-cover-isbn-rejections"
kind = "test-only"
description = "the ISBN tests cover what is rejected, not only what is accepted"

# An `added-parameter` decoy is a documented function that quietly gains an
# optional parameter the page does not mention. The page is now incomplete and
# still accurate, and synclint reports what is inaccurate — so these must
# produce nothing. All three were planted as drift cases first, and the accuracy
# harness is what showed that the verification prompt and the manifest disagreed
# about them.

[[decoy]]
id = "find-gains-author-filter"
kind = "added-parameter"
description = "find takes an author filter the page never mentions"

[[decoy]]
id = "read-csv-gains-encoding"
kind = "added-parameter"
description = "read_csv takes an encoding the page never mentions"

[[decoy]]
id = "save-gains-compression"
kind = "added-parameter"
description = "save can gzip the file, which the page never mentions"
