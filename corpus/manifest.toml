# Ground truth for the fixture corpus.
#
# Each case is one commit against `corpus/base`, and records the section that
# commit should invalidate and the chunk whose change invalidates it. This is
# written by hand and deliberately independent of what synclint can currently
# detect: a case nothing reaches is a gap in the tool to be measured, not a
# case to be rewritten.
#
# Kinds: renamed-parameter, changed-default, removed-capability,
# contradicted-claim. Five of each of the first three; two of the last, for the
# reason corpus/README.md gives under "What drift is not".
#
# `repair_says` and `repair_drops` are what a correct repair of the section
# contains and no longer contains, matched exactly. They are written in each
# page's own voice, so a repair that gets the fact right but writes "7" where the
# page writes "seven" is judged incorrect: matching the voice is part of the
# job. Where a case removes a capability, `repair_says` names something the
# section got right that a repair must not lose along with it.

[[case]]
id = "find-query-renamed"
kind = "renamed-parameter"
section = "docs/catalogue.md#Catalogue > Finding books"
chunk = "bookshelf/catalogue.py::Catalogue.find"
description = "find's query parameter is now called text"
repair_says = ["find(text)"]
repair_drops = ["find(query)"]

[[case]]
id = "read-csv-path-renamed"
kind = "renamed-parameter"
section = "docs/importing.md#Importing > Reading a CSV"
chunk = "bookshelf/importer.py::read_csv"
description = "read_csv takes source rather than path"
repair_says = ["read_csv(source)"]
repair_drops = ["read_csv(path)"]

[[case]]
id = "lend-borrower-renamed"
kind = "renamed-parameter"
section = "docs/loans.md#Loans > Lending a book"
chunk = "bookshelf/loans.py::lend"
description = "lend takes reader rather than borrower"
repair_says = ["lend(book, reader)"]
repair_drops = ["lend(book, borrower)"]

[[case]]
id = "normalise-raw-renamed"
kind = "renamed-parameter"
section = "docs/isbn.md#ISBNs > Normalising"
chunk = "bookshelf/isbn.py::normalise"
description = "normalise takes text rather than raw"
repair_says = ["normalise(text)"]
repair_drops = ["normalise(raw)"]

[[case]]
id = "write-json-path-renamed"
