[project]
name = "synclint"
version = "0.1.0"
description = "Detects documentation a code change has made inaccurate, repairs what it can, flags the rest."
readme = "README.md"
authors = [
    { name = "Ansh Chhikara", email = "chikaraansh0@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "openai>=3.16.2",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.4.2",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.12"
strict = true
